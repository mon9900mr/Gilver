<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10100f"><title>ورود و عضویت | GILVER</title><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><style>
body{background:#10100e;color:#f4ecdf;font-family:Estedad,sans-serif}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 10%,#6e51251c,transparent 36%),#10100e}.auth-card{width:min(100%,460px);padding:34px;border:1px solid #cba45e38;border-radius:26px;background:#191713;box-shadow:0 28px 90px #0008}.auth-brand{text-align:center;margin-bottom:28px}.auth-brand strong{display:block;font:800 25px Manrope;letter-spacing:.18em;color:#e6c783}.auth-brand span{font-size:10px;color:#a99a7e}.auth-card h1{font-size:25px;margin:0 0 8px}.auth-card>p{color:#a99f8d;font-size:13px;line-height:2}.auth-tabs{display:flex;gap:8px;padding:5px;background:#100f0d;border-radius:14px;margin:22px 0}.auth-tabs button{flex:1;border:0;border-radius:10px;padding:11px;background:transparent;color:#a99f8d;font:600 13px Estedad;cursor:pointer}.auth-tabs button.active{background:linear-gradient(135deg,#e4c98c,#b98d49);color:#17130d}.auth-form{display:grid;gap:14px}.auth-form label{font-size:12px;color:#c7b99f}.auth-form input{width:100%;margin-top:7px;border:1px solid #cba45e30;background:#100f0d;color:#fff;padding:14px;border-radius:12px;font:14px Estedad}.auth-submit{border:0;border-radius:13px;padding:14px;background:linear-gradient(120deg,#e6ca8d,#b68a46);color:#18130b;font:700 14px Estedad;cursor:pointer}.auth-message{padding:11px;border-radius:11px;background:#d2ad6817;color:#dfc68f;font-size:12px;line-height:1.8}.auth-message[hidden],.auth-form label[hidden]{display:none}.auth-back{display:block;text-align:center;margin-top:22px;color:#c8a768;font-size:12px}
</style></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><strong>GILVER</strong><span>FINE JEWELRY · EST. 2026</span></div><h1 id="auth-title">خوش برگشتی</h1><p id="auth-desc">برای ادامه، وارد حساب گیلور شو.</p><div class="auth-tabs"><button type="button" class="active" data-mode="login">ورود</button><button type="button" data-mode="signup">ساخت حساب</button></div><form class="auth-form" id="auth-form"><label hidden>نام کامل<input name="full_name" autocomplete="name" placeholder="نام و نام خانوادگی"></label><label>ایمیل<input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" minlength="8" placeholder="حداقل ۸ کاراکتر" required></label><button class="auth-submit" type="submit">ورود به حساب</button><div class="auth-message" id="auth-message" hidden></div></form><a class="auth-back" href="index.html">بازگشت به فروشگاه ←</a></section></main><script type="module">
import{supabase,showMessage}from'./assets/js/supabase.js';const form=document.querySelector('#auth-form'),msg=document.querySelector('#auth-message'),tabs=[...document.querySelectorAll('[data-mode]')],nameLabel=form.querySelector('label:first-child'),submit=form.querySelector('button[type=submit]');let mode='login';function setMode(v){mode=v;tabs.forEach(x=>x.classList.toggle('active',x.dataset.mode===v));nameLabel.hidden=v!=='signup';nameLabel.querySelector('input').required=v==='signup';document.querySelector('#auth-title').textContent=v==='login'?'خوش برگشتی':'به گیلور بپیوند';document.querySelector('#auth-desc').textContent=v==='login'?'برای ادامه، وارد حساب گیلور شو.':'حساب خودت را بساز و انتخاب‌هایت را نگه دار.';submit.textContent=v==='login'?'ورود به حساب':'ساخت حساب';msg.hidden=true}tabs.forEach(x=>x.onclick=()=>setMode(x.dataset.mode));form.onsubmit=async e=>{e.preventDefault();if(!supabase){showMessage(msg,'اتصال Supabase هنوز تنظیم نشده؛ فایل تنظیمات را کامل کن.');return}submit.disabled=true;try{const email=form.elements.email.value.trim(),password=form.elements.password.value;if(mode==='login'){const{error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;location.href='account.html'}else{const{data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:form.elements.full_name.value.trim()}}});if(error)throw error;showMessage(msg,data.session?'حساب ساخته شد.':'حساب ساخته شد؛ ایمیلت را برای تأیید بررسی کن.','success');if(data.session)setTimeout(()=>location.href='account.html',900)}}catch(err){showMessage(msg,err.message||'عملیات انجام نشد.')}finally{submit.disabled=false}};</script></body></html>
