<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب من | GILVER</title><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#10100e;color:#f4ecdf;font-family:Estedad,sans-serif}.account{max-width:620px;margin:12vh auto;padding:35px;background:#191713;border:1px solid #cba45e44;border-radius:24px}.account h1{color:#dfbf7b}.account p{line-height:2;color:#b9ad98}.account a,.account button{display:inline-block;margin:8px;padding:12px 18px;border:1px solid #cba45e66;border-radius:12px;background:#cba45e17;color:#e5c783;text-decoration:none;cursor:pointer;font:13px Estedad}</style></head><body><main class="account"><h1>حساب کاربری</h1><p id="account-info">در حال بارگذاری…</p><a href="index.html">بازگشت به فروشگاه</a><a id="admin-link" href="admin.html" hidden>پنل مدیریت</a><button id="logout">خروج از حساب</button></main><script type="module">import{requireUser,supabase}from'./assets/js/supabase.js';try{const{user,profile}=await requireUser();document.querySelector('#account-info').textContent=(profile.full_name||user.email)+' — '+(profile.role==='admin'?'مدیر اصلی':'مشتری');if(profile.role==='admin')document.querySelector('#admin-link').hidden=false}catch(e){document.querySelector('#account-info').textContent=e.message}document.querySelector('#logout').onclick=async()=>{await supabase?.auth.signOut();location.href='login.html'};</script></body></html>
